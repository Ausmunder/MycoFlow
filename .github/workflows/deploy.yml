name: Deploy to Home Assistant

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ha
        chmod 600 ~/.ssh/id_ha
        
    - name: Deploy backend to HA
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        echo "🚀 Deploying backend to Home Assistant..."
        
        # Copy backend files to HA (skip host key checking)
        scp -i ~/.ssh/id_ha -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o MACs=hmac-sha2-256-etm@openssh.com -r backend/* $SSH_USER@$SSH_HOST:/config/sopp-tracker/backend/
        
        # Rebuild and restart Docker container
        ssh -i ~/.ssh/id_ha -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o MACs=hmac-sha2-256-etm@openssh.com $SSH_USER@$SSH_HOST << 'ENDSSH'
          cd /config/sopp-tracker/backend
          
          echo "🔨 Building Docker image..."
          docker rmi sopp-tracker -f || true
          docker build --no-cache --pull -t sopp-tracker .
          
          echo "♻️  Restarting container..."
          docker stop sopp-tracker || true
          docker rm sopp-tracker || true
          docker run -d \
            --name sopp-tracker \
            --restart unless-stopped \
            -p 8000:8000 \
            -e DATABASE_URL='postgresql+psycopg://sopp:sopp123@sopp-tracker-db:5432/sopp_tracker' \
            --network sopp-tracker_sopp-network \
            sopp-tracker
          
          echo "✅ Deployment complete!"
          docker logs sopp-tracker --tail 10
        ENDSSH
        
    - name: Verify deployment
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
      run: |
        echo "🔍 Verifying backend is running..."
        sleep 5
        curl -f http://$SSH_HOST:8000/ || exit 1
        echo "✅ Backend is responding!"
